server:
  port: 8085
  shutdown: graceful
  servlet:
    context-path: /

spring:
  application:
    name: result-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:result_db}?currentSchema=results
    username: ${DB_USER:diagdesk}
    password: ${DB_PASSWORD:diagdesk}
    hikari:
      pool-name:              result-hikari
      minimum-idle:           5
      maximum-pool-size:      20
      connection-timeout:     30000
      idle-timeout:           600000
      max-lifetime:           1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect:              org.hibernate.dialect.PostgreSQLDialect
        default_schema:       results
        jdbc:
          batch_size:         50
          time_zone:          UTC

  flyway:
    enabled:              true
    baseline-on-migrate:  true
    schemas:              results
    locations:            classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:   ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/diagdesk}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/diagdesk/protocol/openid-connect/certs}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: result-service
      auto-offset-reset: earliest
      key-deserializer:   org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks:             all
      retries:          5
      properties:
        enable.idempotence:                        true
        max.in.flight.requests.per.connection:     1
        spring.json.add.type.headers:             false

diagdesk:
  catalog-service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  order-service:
    url: ${ORDER_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      service: result-service
      env: ${DEPLOY_ENV:local}
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.diagdesk:                INFO
    org.hibernate.SQL:           ${LOG_SQL:WARN}
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId},%X{spanId}] [%X{tenantId}] %-5level %logger{40} - %msg%n"
