server:
  port: 8081
  shutdown: graceful   # waits for in-flight requests on SIGTERM (Kubernetes rolling deploy)
  servlet:
    context-path: /

spring:
  application:
    name: patient-service

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:patient_db}?currentSchema=patient
    username: ${DB_USER:diagdesk}
    password: ${DB_PASSWORD:diagdesk}
    hikari:
      pool-name:              patient-hikari
      minimum-idle:           5
      maximum-pool-size:      20
      connection-timeout:     30000
      idle-timeout:           600000
      max-lifetime:           1800000
      # Set Postgres session variable for RLS on every new connection
      connection-init-sql:    "SET app.tenant_id = ''"

  jpa:
    open-in-view: false              # prevent accidental lazy-load outside transaction
    hibernate:
      ddl-auto: validate             # Flyway owns schema; Hibernate must not alter it
    properties:
      hibernate:
        dialect:              org.hibernate.dialect.PostgreSQLDialect
        default_schema:       patient
        jdbc:
          batch_size:         50
          time_zone:          UTC
        order_inserts:        true
        order_updates:        true
        generate_statistics:  false

  # ── Flyway schema migrations ────────────────────────────────────────────────
  flyway:
    enabled:              true
    baseline-on-migrate:  true
    schemas:              patient
    locations:            classpath:db/migration

  # ── Redis (CacheService + IdempotencyService + UhidGenerator) ───────────────
  data:
    redis:
      host:     ${REDIS_HOST:localhost}
      port:     ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout:  2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle:   10
          min-idle:   2

  # ── Keycloak JWT resource server ─────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/diagdesk}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/diagdesk/protocol/openid-connect/certs}

  # ── Kafka (audit events) ─────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks:             all
      retries:          5
      properties:
        enable.idempotence:                        true
        max.in.flight.requests.per.connection:     1
        spring.json.add.type.headers:             false

# ── Actuator + Prometheus ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      service: patient-service
      env: ${DEPLOY_ENV:local}

  # OpenTelemetry trace export
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.diagdesk:                INFO
    org.hibernate.SQL:           ${LOG_SQL:WARN}
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId},%X{spanId}] [%X{tenantId}] %-5level %logger{40} - %msg%n"
