# Local development overrides — active when -Dspring.profiles.active=local
# Points to the single diagdesk Postgres, local Redis, and local Kafka.
# Security is bypassed by LocalSecurityConfig (no Keycloak needed).

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/diagdesk?currentSchema=patient
    username: diagdesk
    password: diagdesk

  data:
    redis:
      host: localhost
      port: 6379
      password: ""

  kafka:
    bootstrap-servers: localhost:29092

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

management:
  tracing:
    sampling:
      probability: 0.0

logging:
  level:
    com.diagdesk: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
