# DiagDesk local development infrastructure
# Starts: PostgreSQL 16 (all 10 schemas), Redis 7, Kafka 3 (KRaft — no ZooKeeper), Keycloak 24
# Usage: docker compose --env-file .env up -d
# Host ports:
#   Postgres  → localhost:5432
#   Redis     → localhost:6379
#   Kafka     → localhost:29092  (use this in Spring Boot application-local.yml)
#   Keycloak  → localhost:8080   (admin: admin/admin — import realm from ./keycloak/realm-diagdesk.json)

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: diagdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       diagdesk
      POSTGRES_USER:     ${POSTGRES_USER:-diagdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diagdesk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diagdesk} -d diagdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: diagdesk-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka (KRaft — no ZooKeeper) ─────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: diagdesk-kafka
    restart: unless-stopped
    environment:
      # KRaft mode — single node acts as both broker and controller
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # Listeners:
      #   PLAINTEXT  — internal docker-network
      #   CONTROLLER — KRaft controller (internal)
      #   EXTERNAL   — host machine access on port 29092
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s


  # ── Keycloak (OIDC identity provider — required for !local Spring profiles) ────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: diagdesk-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN:          admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-diagdesk.json:/opt/keycloak/data/import/realm-diagdesk.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/diagdesk || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s


  # ── Jaeger (distributed tracing — OTLP + UI) ─────────────────────────────────
  # Services send OTLP traces to localhost:4318 (HTTP) or localhost:4317 (gRPC).
  # UI: http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: diagdesk-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"    # Jaeger UI
      - "${JAEGER_OTLP_GRPC:-4317}:4317"   # OTLP gRPC receiver
      - "${JAEGER_OTLP_HTTP:-4318}:4318"   # OTLP HTTP receiver (default for Spring services)
      - "14269:14269"                        # Admin/metrics (scraped by Prometheus)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/health | grep -q '\"status\":\"Server available\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus (metrics collection) ──────────────────────────────────────────
  # UI: http://localhost:9090
  # Services are scraped via host.docker.internal (Mac/Docker Desktop).
  # On Linux replace host.docker.internal with 172.17.0.1 in prometheus/prometheus.yml.
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: diagdesk-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q 'Prometheus Server is Healthy'"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - jaeger

  # ── Grafana (dashboards) ──────────────────────────────────────────────────────
  # UI: http://localhost:3000  (admin / admin — change on first login)
  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: diagdesk-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus
      - jaeger


volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
