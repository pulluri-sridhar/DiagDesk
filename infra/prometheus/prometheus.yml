# DiagDesk — Prometheus scrape configuration
# Services run on the host; reached via host.docker.internal from inside the container.
# On Linux replace host.docker.internal with 172.17.0.1 (Docker host bridge IP).

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    project: diagdesk

scrape_configs:

  # ── Java microservices (Spring Boot Actuator /actuator/prometheus) ────────────
  - job_name: patient-service
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service: patient-service

  - job_name: catalog-service
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          service: catalog-service

  - job_name: order-service
    static_configs:
      - targets: ["host.docker.internal:8083"]
        labels:
          service: order-service

  - job_name: result-service
    static_configs:
      - targets: ["host.docker.internal:8085"]
        labels:
          service: result-service

  - job_name: reporting-service
    static_configs:
      - targets: ["host.docker.internal:8086"]
        labels:
          service: reporting-service

  - job_name: mis-analytics-service
    static_configs:
      - targets: ["host.docker.internal:8087"]
        labels:
          service: mis-analytics-service

  - job_name: notification-service
    static_configs:
      - targets: ["host.docker.internal:8088"]
        labels:
          service: notification-service

  - job_name: audit-consent-service
    static_configs:
      - targets: ["host.docker.internal:8089"]
        labels:
          service: audit-consent-service

  - job_name: b2b-billing-service
    static_configs:
      - targets: ["host.docker.internal:8090"]
        labels:
          service: b2b-billing-service

  # ── Go device-gateway (/metrics, Prometheus exposition format) ─────────────────
  - job_name: device-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8084"]
        labels:
          service: device-gateway

  # ── Infrastructure ────────────────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Jaeger internal metrics ────────────────────────────────────────────────────
  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:14269"]
        labels:
          service: jaeger
