{{- if .Values.sealedSecrets.enabled }}
# SealedSecret — decrypted by the Bitnami Sealed Secrets controller into a regular
# Kubernetes Secret named "diagdesk-central-secrets".
# Keys are injected as env vars into every cloud service container via envFrom.
#
# Keys exposed:
#   DB_USER              — Supabase postgres user  (e.g. postgres.projectref)
#   DB_PASSWORD          — Supabase postgres password
#   KAFKA_SASL_USERNAME  — Managed Kafka SASL username (blank if Kafka unused)
#   KAFKA_SASL_PASSWORD  — Managed Kafka SASL password / API secret
#   KEYCLOAK_ADMIN_PASSWORD — Keycloak admin password (optional)
#
# Run: infra/helm/seal-central-secrets.sh to generate sealed values.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: diagdesk-central-secrets
  namespace: {{ .Values.namespace }}
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  labels:
    {{- include "diagdesk-central.labels" . | nindent 4 }}
spec:
  encryptedData:
    DB_USER:               {{ required "sealedSecrets.dbUser is required" .Values.sealedSecrets.dbUser | quote }}
    DB_PASSWORD:           {{ required "sealedSecrets.dbPassword is required" .Values.sealedSecrets.dbPassword | quote }}
    KAFKA_SASL_USERNAME:   {{ .Values.sealedSecrets.kafkaSaslUsername | default "" | quote }}
    KAFKA_SASL_PASSWORD:   {{ .Values.sealedSecrets.kafkaSaslPassword | default "" | quote }}
    KEYCLOAK_ADMIN_PASSWORD: {{ .Values.sealedSecrets.keycloakAdminPassword | default "" | quote }}
  template:
    metadata:
      name: diagdesk-central-secrets
      namespace: {{ .Values.namespace }}
    type: Opaque
{{- end }}
