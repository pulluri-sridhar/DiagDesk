apiVersion: v2
name: diagdesk-branch
description: >
  DiagDesk offline-capable branch deployment.
  Runs the 7 patient-facing services on a local k3s cluster inside the lab.
  Central services (analytics, audit, billing) are NOT deployed here — they run
  in the cloud tenant and sync when connectivity is restored.
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: "15.5.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  - name: redis
    version: "19.6.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled

  - name: kafka
    version: "29.3.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled

maintainers:
  - name: DiagDesk Platform Team
    email: platform@diagdesk.in
