{{- if .Values.sealedSecrets.enabled }}
# SealedSecret — decrypted by the Bitnami Sealed Secrets controller into a regular
# Kubernetes Secret named "diagdesk-app-secrets".
# All keys in this secret are injected as env vars into every service container
# via envFrom.secretRef, making them available alongside the values from values.yaml.
#
# IMPORTANT: Encrypted values are cluster-specific.
# Run: ./seal-secrets.sh  to generate sealed values for your cluster.
# Then re-deploy with: helm upgrade diagdesk-branch ./diagdesk-branch \
#   -f values-production.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: diagdesk-app-secrets
  namespace: {{ .Values.namespace }}
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  labels:
    {{- include "diagdesk.labels" . | nindent 4 }}
spec:
  encryptedData:
    DB_PASSWORD:                {{ required "sealedSecrets.dbPassword is required" .Values.sealedSecrets.dbPassword | quote }}
    SUPABASE_SERVICE_ROLE_KEY:  {{ required "sealedSecrets.supabaseServiceRoleKey is required" .Values.sealedSecrets.supabaseServiceRoleKey | quote }}
    MSG91_AUTH_KEY:             {{ required "sealedSecrets.msg91AuthKey is required" .Values.sealedSecrets.msg91AuthKey | quote }}
    INTERNAL_SERVICE_TOKEN:     {{ .Values.sealedSecrets.internalServiceToken | default "" | quote }}
    KEYCLOAK_ADMIN_PASSWORD:    {{ .Values.sealedSecrets.keycloakAdminPassword | default "" | quote }}
  template:
    metadata:
      name: diagdesk-app-secrets
      namespace: {{ .Values.namespace }}
    type: Opaque
{{- end }}
