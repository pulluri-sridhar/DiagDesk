apiVersion: v1
kind: Secret
metadata:
  name: diagdesk-db-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "diagdesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ .Values.postgresql.auth.password | quote }}
